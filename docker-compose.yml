version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_scanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/stock_scanner
      APP_ENV: production
      LOG_LEVEL: INFO
      BATCH_CRON_HOUR: 17
      BATCH_CRON_MINUTE: 30
      BATCH_TIMEZONE: Asia/Seoul
      COLLECT_RETRY_ATTEMPTS: 3
      COLLECT_RETRY_WAIT_SECONDS: 5
      PYKRX_REQUEST_DELAY_MS: 200
      DEFAULT_LOOKBACK_DAYS: 60
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
