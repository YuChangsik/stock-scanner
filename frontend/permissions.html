<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>권한관리 — 댕댕투자</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    .perm-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .perm-section h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 18px;
    }

    /* Role tab */
    .role-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .role-tab {
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all .15s;
    }
    .role-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Permission grid */
    .perm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .perm-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: border-color .15s;
    }
    .perm-item:hover { border-color: var(--accent); }
    .perm-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .perm-item label {
      font-size: 14px;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
    }
    .perm-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .perm-item.disabled input { cursor: not-allowed; }

    /* User table */
    .user-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .user-table th {
      text-align: left;
      padding: 10px 14px;
      color: var(--text-secondary);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }
    .user-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }
    .user-table tr:last-child td { border-bottom: none; }

    .role-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .role-badge.admin { background: #fef3c7; color: #92400e; }
    .role-badge.user  { background: #eff6ff; color: #1d4ed8; }

    .role-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    .status-dot.active   { background: #22c55e; }
    .status-dot.inactive { background: #ef4444; }

    .save-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="/main.html">🐶 <span>댕댕투자</span></a>
    <button class="navbar-toggle" id="navToggle" aria-label="메뉴">☰</button>
    <div class="navbar-nav" id="navMenu">
      <span class="nav-user" id="navUser"></span>
      <a class="nav-link" href="/main.html"          data-page="home">홈</a>
      <a class="nav-link" href="/settings.html"      data-page="settings">⚙️ 조건설정</a>
      <a class="nav-link" href="/sector.html"        data-page="sector">🏭 업종현황</a>
      <a class="nav-link" href="/research.html"      data-page="research">📰 리서치</a>
      <a class="nav-link" href="/analysis.html"      data-page="analysis">🤖 종목분석</a>
      <a class="nav-link" href="/notify.html"        data-page="notify">🔔 알림설정</a>
      <a class="nav-link" href="/admin.html"         data-page="admin" data-role="admin">🛠 배치관리</a>
      <a class="nav-link active" href="/permissions.html" data-page="permissions" data-role="admin">🔐 권한관리</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn">로그아웃</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <div class="page-title">권한관리</div>
        <div class="page-subtitle">역할별 페이지 접근 권한 및 사용자 역할 관리</div>
      </div>
    </div>

    <!-- 역할별 페이지 권한 -->
    <div class="perm-section">
      <h2>역할별 페이지 권한</h2>

      <div class="role-tabs">
        <button class="role-tab active" data-role="user">일반사용자</button>
        <button class="role-tab" data-role="admin" disabled style="opacity:.5;cursor:not-allowed;" title="관리자 권한은 변경할 수 없습니다">관리자 (고정)</button>
      </div>

      <div id="permGrid" class="perm-grid">
        <div class="text-secondary" style="font-size:13px;">로딩 중...</div>
      </div>

      <div class="save-row">
        <button class="btn btn-primary" id="savePermBtn">저장</button>
      </div>
    </div>

    <!-- 사용자 목록 -->
    <div class="perm-section">
      <h2>사용자 목록</h2>
      <div id="userTableWrap">
        <div class="text-secondary" style="font-size:13px;">로딩 중...</div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
  (async function () {
    if (!requireAuth()) return;
    await initNav();

    // 관리자 아닌 경우 차단
    if (getRole() !== 'admin') {
      document.querySelector('.container').innerHTML =
        '<div class="card" style="text-align:center;padding:60px 20px;">' +
        '<p style="font-size:18px;margin-bottom:8px;">🔒 접근 권한이 없습니다.</p>' +
        '<p class="text-secondary">관리자만 접근할 수 있는 페이지입니다.</p>' +
        '</div>';
      return;
    }

    document.getElementById('logoutBtn').addEventListener('click', function () {
      clearAuth(); location.href = '/login.html';
    });

    let allPages = [];
    let rolePermissions = {};
    let currentRole = 'user';

    // ── 페이지 권한 로드 ─────────────────────────────────────────────────
    async function loadPermissions() {
      try {
        const data = await getPermRoles();
        allPages = data.pages || [];
        rolePermissions = data.roles || {};
        renderPermGrid();
      } catch (e) {
        showToast('권한 정보 로드 실패: ' + e.message, 'error');
      }
    }

    function renderPermGrid() {
      const allowed = new Set(rolePermissions[currentRole] || []);
      const grid = document.getElementById('permGrid');
      if (!allPages.length) { grid.innerHTML = '<div>페이지 없음</div>'; return; }

      grid.innerHTML = allPages.map(function(p) {
        const checked = allowed.has(p.key);
        const isFixed = currentRole === 'admin';
        return `<div class="perm-item${isFixed ? ' disabled' : ''}">
          <input type="checkbox" id="perm_${p.key}" value="${p.key}"
            ${checked ? 'checked' : ''} ${isFixed ? 'disabled' : ''}>
          <label for="perm_${p.key}">${p.label}</label>
        </div>`;
      }).join('');
    }

    // 역할 탭 전환
    document.querySelectorAll('.role-tab:not([disabled])').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.role-tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        currentRole = tab.getAttribute('data-role');
        renderPermGrid();
      });
    });

    // 저장
    document.getElementById('savePermBtn').addEventListener('click', async function () {
      if (currentRole === 'admin') return;
      const checked = Array.from(document.querySelectorAll('#permGrid input[type=checkbox]:checked'))
        .map(function(el) { return el.value; });
      try {
        await updatePermRole(currentRole, checked);
        rolePermissions[currentRole] = checked;
        showToast('저장되었습니다.');
      } catch (e) {
        showToast(e.message, 'error');
      }
    });

    // ── 사용자 목록 ─────────────────────────────────────────────────────
    async function loadUsers() {
      try {
        const data = await getPermUsers();
        renderUserTable(data.users || []);
      } catch (e) {
        document.getElementById('userTableWrap').innerHTML =
          '<p class="text-secondary" style="font-size:13px;">사용자 목록 로드 실패: ' + e.message + '</p>';
      }
    }

    function renderUserTable(users) {
      if (!users.length) {
        document.getElementById('userTableWrap').innerHTML = '<p class="text-secondary" style="font-size:13px;">사용자 없음</p>';
        return;
      }
      const rows = users.map(function(u) {
        return `<tr>
          <td>${u.id}</td>
          <td>${esc(u.username)}</td>
          <td>${esc(u.nickname)}</td>
          <td>
            <span class="status-dot ${u.is_active ? 'active' : 'inactive'}"></span>
            ${u.is_active ? '활성' : '비활성'}
          </td>
          <td>
            <select class="role-select" data-uid="${u.id}" data-current="${u.role}">
              <option value="user"  ${u.role === 'user'  ? 'selected' : ''}>일반사용자</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>관리자</option>
            </select>
          </td>
          <td><small class="text-secondary">${u.created_at.slice(0,10)}</small></td>
        </tr>`;
      }).join('');

      document.getElementById('userTableWrap').innerHTML = `
        <table class="user-table">
          <thead>
            <tr>
              <th>ID</th><th>아이디</th><th>닉네임</th><th>상태</th><th>역할</th><th>가입일</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;

      // role select 이벤트
      document.querySelectorAll('.role-select').forEach(function(sel) {
        sel.addEventListener('change', async function() {
          const uid  = parseInt(sel.getAttribute('data-uid'));
          const role = sel.value;
          try {
            await updateUserRole(uid, role);
            sel.setAttribute('data-current', role);
            showToast('역할이 변경되었습니다.');
          } catch (e) {
            sel.value = sel.getAttribute('data-current');
            showToast(e.message, 'error');
          }
        });
      });
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Toast ─────────────────────────────────────────────────────────────
    function showToast(msg, type) {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;
        padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;
        background:${type==='error'?'#fee2e2':'#dcfce7'};
        color:${type==='error'?'#991b1b':'#166534'};
        box-shadow:0 4px 16px rgba(0,0,0,.12);`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 3000);
    }

    await Promise.all([loadPermissions(), loadUsers()]);
  })();
  </script>
</body>
</html>
