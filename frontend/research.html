<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리서치 — 댕댕투자</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="/main.html">🐶 <span>댕댕투자</span></a>
    <button class="navbar-toggle" id="navToggle" aria-label="메뉴">☰</button>
    <div class="navbar-nav" id="navMenu">
      <span class="nav-user" id="navUser"></span>
      <a class="nav-link" href="/main.html"            data-page="home">홈</a>
      <a class="nav-link" href="/settings.html"        data-page="settings">⚙️ 조건설정</a>
      <a class="nav-link" href="/sector.html"          data-page="sector">🏭 업종현황</a>
      <a class="nav-link active" href="/research.html" data-page="research">📰 리서치</a>
      <a class="nav-link" href="/analysis.html"        data-page="analysis">🤖 종목분석</a>
      <a class="nav-link" href="/notify.html"          data-page="notify">🔔 알림설정</a>
      <a class="nav-link" href="/admin.html"           data-page="admin" data-role="admin">🛠 배치관리</a>
      <a class="nav-link" href="/permissions.html"     data-page="permissions" data-role="admin">🔐 권한관리</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn">로그아웃</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <div class="page-title">📰 리서치</div>
        <div class="page-subtitle">증권사 종목 리서치 보고서 (네이버 금융)</div>
      </div>
    </div>

    <!-- 날짜 필터 -->
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <label style="font-size:13px;color:var(--text2)">기간</label>
        <input type="date" class="scan-date-input" id="startDateInput">
        <span style="color:var(--text2);font-size:13px">~</span>
        <input type="date" class="scan-date-input" id="endDateInput">
        <button class="btn btn-primary btn-sm" id="searchBtn">조회</button>
        <button class="btn btn-outline btn-sm" id="todayBtn">오늘</button>
        <button class="btn btn-outline btn-sm" id="weekBtn">1주일</button>
        <button class="btn btn-outline btn-sm" id="monthBtn">1개월</button>
        <span id="resultCount" style="font-size:13px;color:var(--text2)"></span>
      </div>
    </div>

    <!-- 리서치 목록 -->
    <div class="card" id="listCard">
      <div class="loading" id="loadingEl">
        <div class="spinner"></div>불러오는 중...
      </div>
      <div id="researchList" style="display:none"></div>
      <div id="emptyEl" style="display:none" class="loading">
        <div style="font-size:32px;margin-bottom:8px">📭</div>
        해당 날짜에 등록된 리서치가 없습니다.
      </div>
    </div>

    <!-- 페이지네이션 -->
    <div style="display:flex;justify-content:center;gap:8px;margin-top:16px" id="paginationEl"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    initNav();
    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearAuth(); location.href = '/login.html';
    });

    let currentStart = '';
    let currentEnd   = '';
    let currentPage  = 1;
    const PAGE_SIZE  = 30;

    // 날짜 헬퍼
    function addDays(dateStr, n) {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }

    function setRange(start, end) {
      document.getElementById('startDateInput').value = start;
      document.getElementById('endDateInput').value   = end;
      currentStart = start;
      currentEnd   = end;
    }

    // 빠른 선택 버튼
    document.getElementById('todayBtn').addEventListener('click', () => {
      setRange(currentEnd, currentEnd);   // 최근 거래일 하루
      loadPage(1);
    });
    document.getElementById('weekBtn').addEventListener('click', () => {
      setRange(addDays(currentEnd, -6), currentEnd);
      loadPage(1);
    });
    document.getElementById('monthBtn').addEventListener('click', () => {
      setRange(addDays(currentEnd, -29), currentEnd);
      loadPage(1);
    });

    function fmtOpinion(v) {
      if (!v) return '';
      const s = String(v).trim();
      const cls = /매수|buy|strong/i.test(s) ? 'badge-green'
                : /중립|hold|neutral/i.test(s) ? 'badge-blue'
                : /매도|sell/i.test(s) ? 'badge-red' : 'badge-blue';
      return `<span class="badge ${cls}" style="font-size:11px">${s}</span>`;
    }

    function fmtPrice(v) {
      if (!v) return null;
      const n = parseInt(String(v).replace(/,/g, ''), 10);
      return isNaN(n) ? null : n.toLocaleString('ko-KR') + '원';
    }

    function renderList(items) {
      const list    = document.getElementById('researchList');
      const empty   = document.getElementById('emptyEl');
      const loading = document.getElementById('loadingEl');
      loading.style.display = 'none';

      if (!items || !items.length) {
        list.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      list.style.display = 'block';
      list.innerHTML = items.map(r => {
        const curPrice    = fmtPrice(r.priceAtWriteDate);  // 작성일 주가
        const targetPrice = fmtPrice(r.goalPrice);          // 목표주가
        const opinion     = fmtOpinion(r.opinion);

        // 괴리율 계산 (목표가 / 작성일주가 - 1)
        let upside = '';
        if (r.priceAtWriteDate && r.goalPrice) {
          const cur = parseInt(String(r.priceAtWriteDate).replace(/,/g, ''), 10);
          const tgt = parseInt(String(r.goalPrice).replace(/,/g, ''), 10);
          if (cur > 0 && tgt > 0) {
            const pct = ((tgt - cur) / cur * 100).toFixed(1);
            const cls = pct >= 0 ? 'chg-up' : 'chg-dn';
            upside = `<span class="${cls}" style="font-size:11px">${pct >= 0 ? '+' : ''}${pct}%</span>`;
          }
        }

        return `
        <div class="research-item">
          <div class="research-title">
            <a href="${r.endUrl || '#'}" target="_blank" rel="noopener">${r.title || '제목 없음'}</a>
          </div>
          <div class="research-meta" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
            ${r.itemName ? `<span class="badge badge-blue" style="font-size:11px">${r.itemName}${r.itemCode ? ' · ' + r.itemCode : ''}</span>` : ''}
            ${opinion}
            ${curPrice ? `<span style="color:var(--text2);font-size:12px">작성일 <strong>${curPrice}</strong></span>` : ''}
            ${targetPrice ? `<span style="color:var(--text-primary);font-size:12px">목표가 <strong>${targetPrice}</strong> ${upside}</span>` : ''}
            <span style="color:var(--text2);font-size:12px">${r.brokerName || '-'}</span>
            <span style="color:var(--text-muted);font-size:12px">${r.writeDate || '-'}</span>
            <span style="color:var(--text-muted);font-size:11px">조회 ${Number(r.readCount || 0).toLocaleString('ko-KR')}</span>
          </div>
        </div>`;
      }).join('');
    }

    function renderPagination(page, hasNext) {
      const el = document.getElementById('paginationEl');
      let html = '';
      if (page > 1) {
        html += `<button class="btn btn-outline btn-sm" onclick="loadPage(${page - 1})">← 이전</button>`;
      }
      html += `<span style="line-height:32px;font-size:13px;color:var(--text2)">${page}페이지</span>`;
      if (hasNext) {
        html += `<button class="btn btn-outline btn-sm" onclick="loadPage(${page + 1})">다음 →</button>`;
      }
      el.innerHTML = html;
    }

    async function loadPage(page) {
      currentPage = page;
      document.getElementById('loadingEl').style.display = 'flex';
      document.getElementById('researchList').style.display = 'none';
      document.getElementById('emptyEl').style.display = 'none';
      document.getElementById('paginationEl').innerHTML = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      try {
        const data = await getResearch(currentStart, currentEnd, page, PAGE_SIZE);
        const items = data.items || [];
        const rangeLabel = currentStart === currentEnd
          ? currentStart
          : `${currentStart} ~ ${currentEnd}`;
        document.getElementById('resultCount').textContent =
          items.length ? `${rangeLabel} · ${items.length}건 (${page}페이지)` : rangeLabel;
        renderList(items);
        renderPagination(page, items.length >= PAGE_SIZE);
      } catch (e) {
        document.getElementById('loadingEl').style.display = 'none';
        document.getElementById('researchList').style.display = 'block';
        document.getElementById('researchList').innerHTML =
          `<div style="color:var(--red);padding:20px 0">불러오지 못했습니다: ${e.message}</div>`;
      }
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      currentStart = document.getElementById('startDateInput').value || currentEnd;
      currentEnd   = document.getElementById('endDateInput').value   || currentStart;
      loadPage(1);
    });

    // 초기 로드: 기본값 = 최근 거래일 하루
    (async () => {
      try {
        const d = await getLatestTradingDay();
        setRange(d.trade_date, d.trade_date);
      } catch {
        const today = new Date().toISOString().slice(0, 10);
        setRange(today, today);
      }
      loadPage(1);
    })();
  </script>
</body>
</html>
