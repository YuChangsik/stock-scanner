<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    /* ── 전략 그룹 카드 ── */
    .strategy-section { margin-bottom: 28px; }
    .strategy-section-title {
      font-size: 14px; font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .strategy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
      margin-bottom: 8px;
    }
    .strategy-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }
    .strategy-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity .15s;
    }
    .strategy-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .strategy-card:hover::before { opacity: 1; }
    .strategy-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .strategy-card.selected::before { opacity: 1; }

    .strategy-icon  { font-size: 24px; margin-bottom: 8px; }
    .strategy-name  { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .strategy-desc  { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .strategy-tags  { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
    .strategy-tag   {
      font-size: 10px; padding: 2px 7px; border-radius: 10px;
      background: rgba(var(--accent-rgb, 59,130,246),.12);
      color: var(--accent);
    }

    .strategy-apply-btn {
      display: none;
      margin-top: 12px;
      width: 100%;
    }
    .strategy-card.selected .strategy-apply-btn { display: block; }

    /* 구분선 */
    .section-divider {
      height: 1px; background: var(--border);
      margin: 24px 0;
    }
    .section-label {
      font-size: 14px; font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label .badge-count {
      background: var(--accent); color: #fff;
      border-radius: 20px; font-size: 11px;
      padding: 1px 8px;
    }
  </style>
</head>

        icon: '📶',
        group: 'momentum',
        desc: 'MACD 히스토그램(MACD - Signal)의 방향과 크기로 모멘텀을 판별합니다.',
        params: [
          {
            key: 'signal', label: '신호 조건', type: 'select', default: 'expanding_bull',
            options: [
              { value: 'expanding_bull', label: '양수 확장 (모멘텀 강화)' },
              { value: 'turning_bull',   label: '음→양 전환 (상승 반전)' },
              { value: 'positive',       label: '양수 (MACD > Signal)' },
              { value: 'negative',       label: '음수 (MACD < Signal)' },
              { value: 'expanding_bear', label: '음수 확장 (하락 가속)' },
              { value: 'turning_bear',   label: '양→음 전환 (하락 반전)' },
            ],
          },
        ],
      },
    ];

    const DEFAULT_CONDITIONS = [
      { name: 'volume_rank', params: { threshold: 20 } },
      { name: 'rsi14', params: { operator: '<', threshold: 40 } },
    ];

    let userConditions = [];
    let allSectors = [];
    let selectedStrategy = null;

    // ── 전략 그룹 렌더 ──────────────────────────────────────────────────────
    function renderStrategies() {
      const grid = document.getElementById('strategyGrid');
      grid.innerHTML = STRATEGY_GROUPS.map(sg => `
        <div class="strategy-card ${selectedStrategy === sg.id ? 'selected' : ''}"
             id="strategy-${sg.id}" onclick="selectStrategy('${sg.id}')">
          <div class="strategy-icon">${sg.icon}</div>
          <div class="strategy-name">${sg.name}</div>
          <div class="strategy-desc">${sg.desc}</div>
          <div class="strategy-tags">${sg.tags.map(t => `<span class="strategy-tag">${t}</span>`).join('')}</div>
          <button class="btn btn-primary btn-sm strategy-apply-btn"
                  onclick="event.stopPropagation(); applyStrategy('${sg.id}')">
            이 전략 적용
          </button>
        </div>
      `).join('');
    }

    function selectStrategy(id) {
      selectedStrategy = selectedStrategy === id ? null : id;
      renderStrategies();
    }

    function applyStrategy(id) {
      const sg = STRATEGY_GROUPS.find(s => s.id === id);
      if (!sg) return;
      if (!confirm(`"${sg.name}" 전략을 적용하면 현재 조건이 초기화됩니다. 계속하시겠습니까?`)) return;

      userConditions = sg.conditions.map(c => ({
        name: c.name,
        params: { ...(c.params || {}) },
      }));
      selectedStrategy = null;
      renderStrategies();
      render();
      document.getElementById('okMsg').textContent = `✅ "${sg.name}" 전략이 적용되었습니다. 저장 버튼으로 확정하세요.`;
      document.getElementById('okMsg').style.display = 'block';
      setTimeout(() => { document.getElementById('okMsg').style.display = 'none'; }, 3000);
    }

    // ── 개별 조건 렌더 ──────────────────────────────────────────────────────
    function isActive(name) { return userConditions.some(c => c.name === name); }
    function getParams(name) {
      const f = userConditions.find(c => c.name === name);
      return f ? f.params : {};
    }

    function updateActiveCount() {
      document.getElementById('activeCount').textContent = userConditions.length;
    }

    function renderSectorPicker(condName, selected) {
      if (!allSectors.length) {
        return `<div class="param-group"><span class="param-label" style="color:var(--text-muted)">업종 데이터 없음 (배치 후 사용 가능)</span></div>`;
      }
      const tags = allSectors.map(s => {
        const on = selected.includes(s);
        return `<button type="button" class="sector-tag ${on ? 'on' : ''}" data-cond="${condName}" data-sector="${s}">${s}</button>`;
      }).join('');
      return `<div class="param-group">
        <span class="param-label">업종 선택 <span class="param-hint">(여러 개 선택 가능 · OR)</span></span>
        <div class="sector-picker" id="sector-picker-${condName}">${tags}</div>
      </div>`;
    }

    function render() {
      const grid = document.getElementById('settingsGrid');
      grid.innerHTML = CONDITION_DEFS.map(def => {
        const active = isActive(def.name);
        const params = getParams(def.name);

        const paramHtml = def.params.map(p => {
          const rawVal = params[p.key];
          const val = rawVal !== undefined ? rawVal : p.default;

          if (p.type === 'sectors') {
            return renderSectorPicker(def.name, Array.isArray(val) ? val : []);
          }
          if (p.type === 'select') {
            const opts = p.options.map(o => {
              // 불리언 비교 처리
              const isSelected = String(o.value) === String(val);
              return `<option value="${o.value}" ${isSelected ? 'selected' : ''}>${o.label}</option>`;
            }).join('');
            return `<div class="param-group">
              <span class="param-label">${p.label}</span>
              <select class="param-input" data-cond="${def.name}" data-param="${p.key}">${opts}</select>
            </div>`;
          }
          return `<div class="param-group">
            <span class="param-label">${p.label}</span>
            <input class="param-input" type="${p.type}" data-cond="${def.name}" data-param="${p.key}"
              value="${val}" min="${p.min ?? ''}" max="${p.max ?? ''}" step="${p.type === 'number' && String(p.default).includes('.') ? '0.1' : '1'}">
          </div>`;
        }).join('');

        const badge = def.comingSoon
          ? '<span class="badge badge-blue" style="margin-left:8px;font-size:11px">준비중</span>'
          : '';

        return `<div class="condition-card ${active ? 'active' : ''}" id="card-${def.name}">
          <div class="toggle-wrap">
            <label class="toggle">
              <input type="checkbox" data-cond="${def.name}" ${active ? 'checked' : ''} ${def.comingSoon ? 'disabled' : ''}>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="condition-info">
            <div class="condition-name">${def.icon} ${def.label}${badge}</div>
            <div class="condition-desc">${def.desc}</div>
            ${def.params.length ? `<div class="condition-params" id="params-${def.name}"
              style="${active ? '' : 'opacity:.4;pointer-events:none'}">${paramHtml}</div>` : ''}
          </div>
        </div>`;
      }).join('');

      // 토글 이벤트
      grid.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          const name = cb.dataset.cond;
          const card = document.getElementById('card-' + name);
          const paramsEl = document.getElementById('params-' + name);
          if (cb.checked) {
            card.classList.add('active');
            if (paramsEl) { paramsEl.style.opacity = '1'; paramsEl.style.pointerEvents = 'auto'; }
            const def = CONDITION_DEFS.find(d => d.name === name);
            const defaultParams = {};
            def.params.forEach(p => { defaultParams[p.key] = p.default; });
            if (!userConditions.find(c => c.name === name)) {
              userConditions.push({ name, params: defaultParams });
            }
          } else {
            card.classList.remove('active');
            if (paramsEl) { paramsEl.style.opacity = '.4'; paramsEl.style.pointerEvents = 'none'; }
            userConditions = userConditions.filter(c => c.name !== name);
          }
          updateActiveCount();
        });
      });

      // 파라미터 변경 이벤트
      grid.querySelectorAll('[data-param]').forEach(el => {
        el.addEventListener('change', () => {
          const cond = userConditions.find(c => c.name === el.dataset.cond);
          if (cond) {
            let val = el.value;
            if (el.type === 'number') val = Number(val);
            else if (val === 'true')  val = true;
            else if (val === 'false') val = false;
            cond.params[el.dataset.param] = val;
          }
        });
      });

      // 업종 태그 토글
      grid.querySelectorAll('.sector-tag').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.classList.toggle('on');
          const condName = btn.dataset.cond;
          const cond = userConditions.find(c => c.name === condName);
          if (cond) {
            cond.params.sectors = Array.from(
              document.querySelectorAll(`.sector-tag[data-cond="${condName}"].on`)
            ).map(b => b.dataset.sector);
          }
        });
      });

      updateActiveCount();
    }

    async function init() {
      const [me, sectorsResp] = await Promise.all([getMe(), getSectors().catch(() => ({ sectors: [] }))]);
      allSectors = sectorsResp.sectors || [];
      userConditions = me.scan_conditions ? JSON.parse(JSON.stringify(me.scan_conditions)) : [...DEFAULT_CONDITIONS];
      renderStrategies();
      render();

      const saved = getDisplayCount();
      const sel = document.getElementById('displayCountSelect');
      const found = Array.from(sel.options).find(o => parseInt(o.value) === saved);
      sel.value = found ? String(saved) : '20';
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      const ok  = document.getElementById('okMsg');
      const err = document.getElementById('errMsg');
      ok.style.display = 'none'; err.style.display = 'none';
      btn.disabled = true; btn.textContent = '저장 중...';

      setDisplayCount(parseInt(document.getElementById('displayCountSelect').value, 10));

      try {
        await updateConditions(userConditions);
        ok.textContent = '✅ 저장되었습니다.';
        ok.style.display = 'block';
        setTimeout(() => { location.href = '/main.html'; }, 1000);
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = '💾 저장';
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      userConditions = JSON.parse(JSON.stringify(DEFAULT_CONDITIONS));
      selectedStrategy = null;
      renderStrategies();
      render();
      document.getElementById('displayCountSelect').value = '20';
    });

    init();
  </script>
</body>
</html>
