<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — 댕댕투자</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>🐶 <span>댕댕투자</span></h1>
        <p>계정을 만들어 나만의 조건검색을 시작하세요</p>
      </div>

      <div class="alert alert-error" id="errMsg"></div>
      <div class="alert alert-success" id="okMsg"></div>

      <form id="signupForm">
        <div class="form-group">
          <label class="form-label">아이디</label>
          <input class="form-control" type="text" id="username" placeholder="영문/숫자 조합" required>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input class="form-control" type="password" id="password" required>
        </div>
        <div class="form-group">
          <label class="form-label">닉네임</label>
          <input class="form-control" type="text" id="nickname" placeholder="화면에 표시될 이름" required>
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="signupBtn">회원가입</button>
      </form>

      <div class="auth-footer">
        이미 계정이 있으신가요? <a href="/login.html">로그인</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (getToken()) location.href = '/main.html';

    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const err = document.getElementById('errMsg');
      const ok = document.getElementById('okMsg');
      err.style.display = 'none';
      ok.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '처리 중...';

      try {
        await signup(
          document.getElementById('username').value,
          document.getElementById('password').value,
          document.getElementById('nickname').value,
        );
        ok.textContent = '회원가입 완료! 메인 화면으로 이동합니다...';
        ok.style.display = 'block';
        setTimeout(() => location.href = '/main.html', 1000);
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '회원가입';
      }
    });
  </script>
</body>
</html>
