<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림설정 — 댕댕투자</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    /* ── 카카오 연동 상태 ─── */
    .kakao-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .kakao-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .kakao-icon {
      width: 44px; height: 44px;
      background: #FEE500;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .kakao-title { font-size: 16px; font-weight: 600; }
    .kakao-desc  { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }
    .status-badge.connected    { background: rgba(34,197,94,.15); color: #22c55e; }
    .status-badge.disconnected { background: rgba(239,68,68,.12);  color: #ef4444; }
    .status-badge::before { content: '●'; font-size: 10px; }

    .kakao-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

    /* ── 조건 섹션 ─── */
    .section-title {
      font-size: 15px; font-weight: 600;
      margin: 24px 0 12px;
      color: var(--text-primary);
    }
    .cond-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .cond-row .cond-label { flex: 1; font-size: 14px; }
    .cond-row .param-input { width: 80px; }
    .cond-row .btn-remove {
      background: none; border: none; cursor: pointer;
      color: #ef4444; font-size: 18px; padding: 0 4px;
    }
    .add-cond-bar {
      display: flex; gap: 10px; align-items: center;
      flex-wrap: wrap; margin-top: 4px;
    }

    /* ── 스케줄 섹션 ─── */
    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .schedule-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    .schedule-label { width: 100px; font-size: 14px; color: var(--text-secondary); }
    .day-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .day-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text-secondary);
      font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .day-btn.active {
      background: var(--accent); color: #fff;
      border-color: var(--accent);
    }
    .time-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      padding: 8px 12px;
      outline: none;
    }
    .time-input:focus { border-color: var(--accent); }

    .enable-row {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 18px;
    }
    .enable-row .label { font-size: 15px; font-weight: 600; }

    /* ── 저장바 ─── */
    .save-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

    /* ── 알림/에러 ─── */
    .alert { padding: 10px 16px; border-radius: 8px; margin-bottom: 14px; display: none; font-size: 14px; }
    .alert.show { display: block; }
    .alert-success { background: rgba(34,197,94,.15); color: #22c55e; }
    .alert-error   { background: rgba(239,68,68,.12);  color: #ef4444; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="/main">🐶 <span>댕댕투자</span></a>
    <button class="navbar-toggle" id="navToggle" aria-label="메뉴">☰</button>
    <div class="navbar-nav" id="navMenu">
      <span class="nav-user" id="navUser"></span>
      <a class="nav-link" href="/main"            data-page="home">홈</a>
      <a class="nav-link" href="/settings"        data-page="settings">⚙️ 조건설정</a>
      <a class="nav-link" href="/sector"          data-page="sector">🏭 업종현황</a>
      <a class="nav-link" href="/research"        data-page="research">📰 리서치</a>
      <a class="nav-link" href="/analysis"        data-page="analysis">🤖 종목분석</a>
      <a class="nav-link active" href="/notify"   data-page="notify">🔔 알림설정</a>
      <a class="nav-link" href="/admin"           data-page="admin" data-role="admin">🛠 배치관리</a>
      <a class="nav-link" href="/permissions"     data-page="permissions" data-role="admin">🔐 권한관리</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn">로그아웃</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <div class="page-title">🔔 카카오톡 알림설정</div>
        <div class="page-subtitle">조건을 만족하는 종목을 카카오톡으로 알려드립니다.</div>
      </div>
    </div>

    <div class="alert alert-success" id="okMsg"></div>
    <div class="alert alert-error"   id="errMsg"></div>

    <!-- ── 카카오 연동 ─────────────────────────────────── -->
    <div class="kakao-card">
      <div class="kakao-header">
        <div class="kakao-icon">💬</div>
        <div>
          <div class="kakao-title">카카오톡 연동</div>
          <div class="kakao-desc">카카오 계정으로 인증하면 "나에게 보내기"로 알림을 수신합니다.</div>
        </div>
        <div style="margin-left:auto">
          <span class="status-badge disconnected" id="kakaoBadge">연결 안됨</span>
        </div>
      </div>
      <div style="font-size:13px; color:var(--text-secondary); margin-bottom:4px" id="kakaoExpiry"></div>
      <div class="kakao-actions">
        <button class="btn btn-primary" id="connectBtn" onclick="connectKakaoHandler()">카카오 계정 연동</button>
        <button class="btn btn-outline" id="testBtn"    onclick="testHandler()">테스트 전송</button>
        <button class="btn btn-outline" id="disconnectBtn" style="color:#ef4444;border-color:#ef4444" onclick="disconnectHandler()">연동 해제</button>
      </div>
    </div>

    <!-- ── 알림 조건 ──────────────────────────────────── -->
    <div class="section-title">📋 알림 조건 설정</div>
    <div style="font-size:13px; color:var(--text-secondary); margin-bottom:12px">
      아래 조건을 <b>모두 만족</b>하는 종목이 있을 때만 메시지를 전송합니다.
      조건을 설정하지 않으면 전체 종목 스캔 결과를 전송합니다.
    </div>
    <div id="condList"></div>
    <div class="add-cond-bar">
      <select class="param-input" id="addCondSelect" style="width:160px">
        <option value="">-- 조건 추가 --</option>
        <option value="volume_rank">거래량 순위</option>
        <option value="rsi14">RSI 14</option>
        <option value="golden_cross">골든크로스 (MA5>MA20)</option>
        <option value="macd">MACD 골든크로스</option>
        <option value="prev_high_breakout">전고점 돌파</option>
        <option value="ma_above">기준선(MA20) 위</option>
        <option value="per">PER</option>
        <option value="pbr">PBR</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="addCondition()">+ 추가</button>
    </div>

    <!-- ── 전송 스케줄 ─────────────────────────────────── -->
    <div class="section-title">⏰ 전송 스케줄</div>
    <div class="schedule-card">

      <!-- 활성화 토글 -->
      <div class="enable-row">
        <span class="label">알림 활성화</span>
        <label class="toggle">
          <input type="checkbox" id="enableToggle">
          <span class="toggle-slider"></span>
        </label>
        <span style="font-size:13px; color:var(--text-secondary)" id="enableLabel">비활성화</span>
      </div>

      <!-- 요일 선택 -->
      <div class="schedule-row">
        <span class="schedule-label">전송 요일</span>
        <div class="day-btns">
          <button class="day-btn" data-day="0">월</button>
          <button class="day-btn" data-day="1">화</button>
          <button class="day-btn" data-day="2">수</button>
          <button class="day-btn" data-day="3">목</button>
          <button class="day-btn" data-day="4">금</button>
          <button class="day-btn" data-day="5">토</button>
          <button class="day-btn" data-day="6">일</button>
        </div>
        <button class="btn btn-outline btn-sm" onclick="toggleWeekdays()">평일만</button>
      </div>

      <!-- 전송 시각 -->
      <div class="schedule-row">
        <span class="schedule-label">전송 시각</span>
        <input type="time" class="time-input" id="notifyTime" value="09:00">
        <span style="font-size:13px; color:var(--text-secondary)">(서울 기준)</span>
      </div>

      <!-- 최소 매칭 수 -->
      <div class="schedule-row">
        <span class="schedule-label">최소 매칭</span>
        <select class="param-input" id="minMatches" style="width:120px">
          <option value="0">0개 이상 (항상)</option>
          <option value="1" selected>1개 이상</option>
          <option value="3">3개 이상</option>
          <option value="5">5개 이상</option>
          <option value="10">10개 이상</option>
        </select>
        <span style="font-size:13px; color:var(--text-secondary)">매칭 종목이 이 수 미만이면 전송 생략</span>
      </div>
    </div>

    <!-- 저장 -->
    <div class="save-bar">
      <button class="btn btn-primary" id="saveBtn" onclick="saveConfig()">💾 저장</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    initNav();
    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearAuth(); location.href = '/login';
    });

    // ── 알림 / 에러 ──────────────────────────────────────────────────────────
    function showOk(msg) {
      const el = document.getElementById('okMsg');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3500);
    }
    function showErr(msg) {
      const el = document.getElementById('errMsg');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    // ── 카카오 연동 상태 ─────────────────────────────────────────────────────
    async function loadKakaoStatus() {
      try {
        const s = await getKakaoStatus();
        const badge = document.getElementById('kakaoBadge');
        const expEl = document.getElementById('kakaoExpiry');
        if (s.connected) {
          badge.textContent = '연결됨';
          badge.className   = 'status-badge connected';
          if (s.expires_at) {
            const d = new Date(s.expires_at);
            expEl.textContent = `토큰 만료: ${d.toLocaleString('ko-KR')}`;
          }
          document.getElementById('connectBtn').style.display = 'none';
        } else {
          badge.textContent = '연결 안됨';
          badge.className   = 'status-badge disconnected';
          expEl.textContent = '';
          document.getElementById('disconnectBtn').style.display = 'none';
          document.getElementById('testBtn').style.display       = 'none';
        }
      } catch(e) {
        showErr('카카오 상태 조회 실패: ' + e.message);
      }
    }

    async function connectKakaoHandler() {
      try {
        const { auth_url } = await getKakaoAuthUrl();
        location.href = auth_url;
      } catch(e) {
        showErr('카카오 인증 URL 오류: ' + e.message);
      }
    }

    async function disconnectHandler() {
      if (!confirm('카카오톡 연동을 해제하시겠습니까?')) return;
      try {
        await disconnectKakao();
        showOk('카카오톡 연동이 해제되었습니다.');
        await loadKakaoStatus();
      } catch(e) {
        showErr('연동 해제 실패: ' + e.message);
      }
    }

    async function testHandler() {
      const btn = document.getElementById('testBtn');
      btn.disabled = true; btn.textContent = '전송 중…';
      try {
        await testNotify();
        showOk('✅ 테스트 메시지가 카카오톡으로 전송되었습니다.');
      } catch(e) {
        showErr('전송 실패: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = '테스트 전송';
      }
    }

    // ── 조건 관리 ────────────────────────────────────────────────────────────
    let conditions = [];

    const COND_DEFAULTS = {
      volume_rank:        { threshold: 20 },
      rsi14:              { operator: '<', threshold: 40 },
      golden_cross:       {},
      macd:               {},
      prev_high_breakout: {},
      ma_above:           {},
      per:                { operator: '<', threshold: 15 },
      pbr:                { operator: '<', threshold: 1 },
    };

    const COND_LABELS = {
      volume_rank:        '거래량 순위',
      rsi14:              'RSI 14',
      golden_cross:       '골든크로스',
      macd:               'MACD 골든크로스',
      prev_high_breakout: '전고점 돌파',
      ma_above:           '기준선(MA20) 위',
      per:                'PER',
      pbr:                'PBR',
    };

    function renderConditions() {
      const list = document.getElementById('condList');
      list.innerHTML = '';
      conditions.forEach((c, idx) => {
        const row = document.createElement('div');
        row.className = 'cond-row';
        let paramsHtml = '';
        const p = c.params || {};
        if (c.name === 'volume_rank') {
          paramsHtml = `<span style="font-size:13px;color:var(--text-secondary)">Top</span>
            <input type="number" class="param-input" value="${p.threshold ?? 20}" min="1" max="200"
              onchange="updateParam(${idx},'threshold',+this.value)" style="width:70px">`;
        } else if (c.name === 'rsi14') {
          paramsHtml = `<select class="param-input" style="width:60px" onchange="updateParam(${idx},'operator',this.value)">
              <option value="<"  ${p.operator==='<'?'selected':''}>미만</option>
              <option value=">"  ${p.operator==='>'?'selected':''}>초과</option>
            </select>
            <input type="number" class="param-input" value="${p.threshold ?? 40}" min="1" max="99"
              onchange="updateParam(${idx},'threshold',+this.value)" style="width:70px">`;
        } else if (c.name === 'per' || c.name === 'pbr') {
          const defaultThr = c.name === 'per' ? 15 : 1;
          paramsHtml = `<select class="param-input" style="width:60px" onchange="updateParam(${idx},'operator',this.value)">
              <option value="<"  ${p.operator==='<'?'selected':''}>미만</option>
              <option value=">"  ${p.operator==='>'?'selected':''}>초과</option>
            </select>
            <input type="number" class="param-input" value="${p.threshold ?? defaultThr}" step="0.1" min="0"
              onchange="updateParam(${idx},'threshold',+this.value)" style="width:80px">`;
        }
        row.innerHTML = `
          <span class="cond-label">${COND_LABELS[c.name] || c.name}</span>
          ${paramsHtml}
          <button class="btn-remove" title="삭제" onclick="removeCond(${idx})">✕</button>`;
        list.appendChild(row);
      });
    }

    function addCondition() {
      const sel = document.getElementById('addCondSelect');
      const name = sel.value;
      if (!name) return;
      // 중복 방지 (골든크로스, MACD 등 중복 불허)
      if (conditions.find(c => c.name === name)) {
        showErr('이미 추가된 조건입니다.'); return;
      }
      conditions.push({ name, params: { ...(COND_DEFAULTS[name] || {}) } });
      sel.value = '';
      renderConditions();
    }

    function removeCond(idx) {
      conditions.splice(idx, 1);
      renderConditions();
    }

    function updateParam(idx, key, val) {
      conditions[idx].params[key] = val;
    }

    // ── 스케줄 UI ────────────────────────────────────────────────────────────
    let selectedDays = new Set([0, 1, 2, 3, 4]);

    document.querySelectorAll('.day-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = +btn.dataset.day;
        if (selectedDays.has(d)) { selectedDays.delete(d); btn.classList.remove('active'); }
        else                     { selectedDays.add(d);    btn.classList.add('active'); }
      });
    });

    function setSelectedDays(arr) {
      selectedDays = new Set(arr);
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.classList.toggle('active', selectedDays.has(+btn.dataset.day));
      });
    }

    function toggleWeekdays() {
      const weekdays = [0,1,2,3,4];
      const allActive = weekdays.every(d => selectedDays.has(d))
                     && selectedDays.size === 5;
      setSelectedDays(allActive ? [] : weekdays);
    }

    const enableToggle = document.getElementById('enableToggle');
    const enableLabel  = document.getElementById('enableLabel');
    enableToggle.addEventListener('change', () => {
      enableLabel.textContent = enableToggle.checked ? '활성화' : '비활성화';
    });

    // ── 설정 로드 ────────────────────────────────────────────────────────────
    async function loadConfig() {
      try {
        const cfg = await getNotifyConfig();
        conditions = cfg.conditions || [];
        renderConditions();

        const sch = cfg.schedule || {};
        enableToggle.checked = !!sch.enabled;
        enableLabel.textContent = sch.enabled ? '활성화' : '비활성화';
        setSelectedDays(sch.weekdays ?? [0,1,2,3,4]);
        document.getElementById('notifyTime').value    = sch.time       || '09:00';
        const mmSel = document.getElementById('minMatches');
        mmSel.value = String(sch.min_matches ?? 1);
        if (!mmSel.value) mmSel.value = '1';
      } catch(e) {
        showErr('설정 로드 실패: ' + e.message);
      }
    }

    // ── 저장 ────────────────────────────────────────────────────────────────
    async function saveConfig() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.textContent = '저장 중…';
      try {
        const schedule = {
          enabled:     enableToggle.checked,
          weekdays:    [...selectedDays].sort(),
          time:        document.getElementById('notifyTime').value || '09:00',
          min_matches: parseInt(document.getElementById('minMatches').value, 10),
        };
        await updateNotifyConfig(conditions, schedule);
        showOk('✅ 알림 설정이 저장되었습니다.');
      } catch(e) {
        showErr('저장 실패: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = '💾 저장';
      }
    }

    // ── 초기화 ────────────────────────────────────────────────────────────
    async function init() {
      // 카카오 연동 콜백으로 돌아온 경우 알림
      const params = new URLSearchParams(location.search);
      if (params.get('kakao') === 'connected') {
        showOk('✅ 카카오톡 연동이 완료되었습니다!');
        history.replaceState({}, '', '/notify');
      }
      await loadKakaoStatus();
      await loadConfig();
      // 평일 기본 선택 (초기 렌더)
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.classList.toggle('active', selectedDays.has(+btn.dataset.day));
      });
    }

    init();
  </script>
</body>
</html>
