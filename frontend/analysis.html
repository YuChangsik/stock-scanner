<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종목분석 — 댕댕투자</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    /* ── Input Card ── */
    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 32px;
      margin-bottom: 24px;
    }
    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .analysis-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text-primary);
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .15s;
      min-width: 0;
    }
    .analysis-input:focus { border-color: var(--accent); }
    #stockInput { width: 220px; }
    #priceInput { width: 160px; }

    /* ── 종목 검색 드롭다운 ── */
    .stock-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      z-index: 999;
      overflow: hidden;
      display: none;
    }
    .stock-dropdown.open { display: block; }
    .stock-dropdown-item {
      padding: 11px 14px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stock-dropdown-item:last-child { border-bottom: none; }
    .stock-dropdown-item:hover { background: var(--bg); }
    .stock-dropdown-ticker {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .stock-selected-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
    }
    .stock-selected-badge .clear-btn {
      cursor: pointer;
      opacity: .8;
      font-size: 14px;
    }

    /* ── Summary Card (최상단) ── */
    .summary-card {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f2540 100%);
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 20px;
      color: #e8f0fe;
    }
    .summary-card h3 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .summary-content {
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
      color: #d0e4ff;
    }
    .research-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,.12);
      color: #a8d0ff;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 14px;
    }

    /* ── Info Box ── */
    .stock-info-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      line-height: 1.7;
    }

    /* ── Result Sections ── */
    .result-wrap { display: none; }
    .result-wrap.visible { display: block; }

    .result-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      margin-bottom: 18px;
    }
    .result-section h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-section h3::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
    }
    .result-content {
      font-size: 14px;
      line-height: 1.85;
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    /* ── Loading ── */
    .loading-wrap { display: none; flex-direction: column; align-items: center; gap: 16px; padding: 60px 20px; }
    .loading-wrap.visible { display: flex; }
    .spinner-lg {
      width: 48px; height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
    .loading-msg { font-size: 14px; color: var(--text-secondary); }
    .loading-steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .loading-step {
      font-size: 13px;
      color: var(--text-secondary);
      opacity: .5;
      transition: opacity .3s;
    }
    .loading-step.active { opacity: 1; color: var(--accent); font-weight: 600; }
    .loading-step.done   { opacity: .7; color: #22c55e; }

    /* ── Template editor (admin) ── */
    .template-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .template-panel h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .template-toggle-icon { font-size: 13px; color: var(--accent); }
    .template-body { display: none; margin-top: 18px; }
    .template-body.open { display: block; }
    .tmpl-field { margin-bottom: 16px; }
    .tmpl-field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .tmpl-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
      transition: border-color .15s;
      box-sizing: border-box;
    }
    .tmpl-textarea:focus { border-color: var(--accent); }
    .section-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .section-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .section-num { font-size: 12px; font-weight: 700; color: var(--accent); width: 22px; }
    .section-title-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      padding: 7px 10px;
      outline: none;
    }
    .tmpl-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    /* ── 팝업 (종목 선택) ── */
    .modal-overlay {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      background: rgba(0,0,0,.45);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px 24px;
      width: 340px;
      max-width: 90vw;
      box-shadow: 0 16px 48px rgba(0,0,0,.2);
    }
    .modal-box h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 16px;
    }
    .modal-stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .modal-stock-item:hover { border-color: var(--accent); background: var(--bg); }
    .modal-stock-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .modal-stock-meta { font-size: 12px; color: var(--text-secondary); }
    .modal-cancel { width: 100%; margin-top: 8px; }

    @media (max-width: 600px) {
      #stockInput { width: 100%; }
      #priceInput { width: 100%; }
      .input-row { flex-direction: column; }
      .input-group { width: 100%; }
      .input-card { padding: 18px 16px; }
      .summary-card { padding: 20px 16px; }
      .result-section { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="/main">🐶 <span>댕댕투자</span></a>
    <button class="navbar-toggle" id="navToggle" aria-label="메뉴">☰</button>
    <div class="navbar-nav" id="navMenu">
      <span class="nav-user" id="navUser"></span>
      <a class="nav-link" href="/main"             data-page="home">홈</a>
      <a class="nav-link" href="/settings"         data-page="settings">⚙️ 조건설정</a>
      <a class="nav-link" href="/sector"           data-page="sector">🏭 업종현황</a>
      <a class="nav-link" href="/research"         data-page="research">📰 리서치</a>
      <a class="nav-link active" href="/analysis"  data-page="analysis">🤖 종목분석</a>
      <a class="nav-link" href="/notify"           data-page="notify">🔔 알림설정</a>
      <a class="nav-link" href="/admin"            data-page="admin" data-role="admin">🛠 배치관리</a>
      <a class="nav-link" href="/permissions"      data-page="permissions" data-role="admin">🔐 권한관리</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn">로그아웃</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <div class="page-title">🤖 종목분석</div>
      </div>
    </div>

    <!-- 분석 입력 -->
    <div class="input-card">
      <div class="input-row">
        <div class="input-group" id="stockInputGroup">
          <label for="stockInput">종목명 또는 종목코드</label>
          <input type="text" id="stockInput" class="analysis-input"
            placeholder="삼성전자 또는 005930" autocomplete="off">
          <div class="stock-dropdown" id="stockDropdown"></div>
          <div id="selectedBadge" style="display:none">
            <span class="stock-selected-badge">
              <span id="selectedLabel"></span>
              <span class="clear-btn" id="clearSelected" title="선택 취소">✕</span>
            </span>
          </div>
        </div>
        <div class="input-group">
          <label for="priceInput">평단가 (선택)</label>
          <input type="number" id="priceInput" class="analysis-input"
            placeholder="예) 75000" min="0" step="1">
        </div>
        <button class="btn btn-primary" id="analyzeBtn" style="min-width:110px;">
          🔍 분석하기
        </button>
      </div>
    </div>

    <!-- 템플릿 편집 (admin 전용) -->
    <div class="template-panel" id="templatePanel" style="display:none;">
      <h2 id="tmplHeader">
        <span>📋 분석 템플릿 설정</span>
        <span class="template-toggle-icon" id="tmplToggleIcon">▶ 펼치기</span>
      </h2>
      <div class="template-body" id="tmplBody">
        <div class="tmpl-field">
          <label>시스템 프롬프트</label>
          <textarea id="tmplSystemPrompt" class="tmpl-textarea" rows="3"></textarea>
        </div>
        <div id="tmplSections"></div>
        <div class="tmpl-actions">
          <button class="btn btn-outline btn-sm" id="tmplResetBtn">기본값으로 초기화</button>
          <button class="btn btn-primary btn-sm" id="tmplSaveBtn">저장</button>
        </div>
      </div>
    </div>

    <!-- 로딩 -->
    <div class="loading-wrap" id="loadingWrap">
      <div class="spinner-lg"></div>
      <div class="loading-steps">
        <div class="loading-step" id="step1">📊 종목 데이터 수집</div>
        <div class="loading-step" id="step2">📰 리서치 수집</div>
        <div class="loading-step" id="step3">🤖 ChatGPT 분석 중...</div>
        <div class="loading-step" id="step4">✅ 결과 정리</div>
      </div>
    </div>

    <!-- 결과 -->
    <div class="result-wrap" id="resultWrap">
      <!-- 요약 (매수/매도/전망) -->
      <div class="summary-card" id="summaryCard">
        <h3>📈 종합 매매 전략 및 전망</h3>
        <div id="researchBadge" class="research-badge" style="display:none">
          📰 <span id="researchCount"></span>건의 리서치 참고
        </div>
        <div class="summary-content" id="summaryContent"></div>
      </div>
      <!-- 지표 요약 -->
      <div class="stock-info-box" id="stockInfoBox"></div>
      <!-- 섹션별 분석 -->
      <div id="resultSections"></div>
    </div>
  </div>

  <!-- 종목 선택 팝업 -->
  <div class="modal-overlay" id="stockModal">
    <div class="modal-box">
      <h3>종목을 선택하세요</h3>
      <div id="modalStockList"></div>
      <button class="btn btn-outline modal-cancel" id="modalCancel">취소</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
  (async function () {
    if (!requireAuth()) return;
    await initNav();

    const isAdmin = getRole() === 'admin';

    document.getElementById('logoutBtn').addEventListener('click', function () {
      clearAuth(); location.href = '/login';
    });

    // ── URL 파라미터 파싱 (DOM 요소 선언 전에 값만 읽어둠) ────────────────────
    const urlParams = new URLSearchParams(location.search);
    let selectedTicker = urlParams.get('ticker') || '';
    let selectedName   = urlParams.get('name')   || '';

    // ── 종목 검색 ─────────────────────────────────────────────────────────────
    const stockInput   = document.getElementById('stockInput');
    const dropdown     = document.getElementById('stockDropdown');
    const selectedBadge = document.getElementById('selectedBadge');
    const selectedLabel = document.getElementById('selectedLabel');
    const clearBtn     = document.getElementById('clearSelected');

    // ── URL 파라미터 자동 선택 (DOM 요소 선언 후에 실행) ─────────────────────
    if (selectedTicker) {
      applySelection(selectedTicker, selectedName || selectedTicker);
    }

    let searchTimer = null;

    stockInput.addEventListener('input', function () {
      clearTimeout(searchTimer);
      const q = this.value.trim();
      if (!q) { closeDropdown(); return; }
      searchTimer = setTimeout(function () { doSearch(q); }, 250);
    });

    stockInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDropdown();
      if (e.key === 'Enter') {
        const first = dropdown.querySelector('.stock-dropdown-item');
        if (first) first.click();
        else doSearch(stockInput.value.trim(), true);
      }
    });

    document.addEventListener('click', function (e) {
      if (!document.getElementById('stockInputGroup').contains(e.target)) closeDropdown();
    });

    clearBtn.addEventListener('click', function () {
      selectedTicker = '';
      selectedName = '';
      selectedBadge.style.display = 'none';
      stockInput.value = '';
      stockInput.style.display = '';
      stockInput.focus();
    });

    async function doSearch(q, autoSelect) {
      if (!q) return;
      try {
        const data = await searchStocks(q);
        const items = data.items || [];
        if (!items.length) {
          showDropdownMsg('❌ 종목을 찾을 수 없습니다.');
          return;
        }
        if (items.length === 1 || autoSelect) {
          // 1개면 바로 선택
          applySelection(items[0].ticker, items[0].name);
          closeDropdown();
          return;
        }
        if (autoSelect && items.length > 1) {
          openModal(items);
          closeDropdown();
          return;
        }
        renderDropdown(items);
      } catch (e) {
        showDropdownMsg('검색 오류: ' + e.message);
      }
    }

    function renderDropdown(items) {
      dropdown.innerHTML = items.map(function (s) {
        return `<div class="stock-dropdown-item" data-ticker="${s.ticker}" data-name="${esc(s.name)}">
          <span>${esc(s.name)}</span>
          <span class="stock-dropdown-ticker">${s.ticker} · ${s.market}</span>
        </div>`;
      }).join('');
      dropdown.querySelectorAll('.stock-dropdown-item').forEach(function (el) {
        el.addEventListener('click', function () {
          applySelection(el.getAttribute('data-ticker'), el.getAttribute('data-name'));
          closeDropdown();
        });
      });
      dropdown.classList.add('open');
    }

    function showDropdownMsg(msg) {
      dropdown.innerHTML = `<div style="padding:12px 14px;font-size:13px;color:var(--text-secondary);">${msg}</div>`;
      dropdown.classList.add('open');
    }

    function closeDropdown() {
      dropdown.classList.remove('open');
      dropdown.innerHTML = '';
    }

    function applySelection(ticker, name) {
      selectedTicker = ticker;
      selectedName   = name;
      selectedLabel.textContent = `${name} (${ticker})`;
      selectedBadge.style.display = '';
      stockInput.style.display = 'none';
      stockInput.value = name;
    }

    // ── 팝업 (2개 이상 종목) ──────────────────────────────────────────────────
    const modal      = document.getElementById('stockModal');
    const modalList  = document.getElementById('modalStockList');

    document.getElementById('modalCancel').addEventListener('click', function () {
      modal.classList.remove('open');
    });
    modal.addEventListener('click', function (e) {
      if (e.target === modal) modal.classList.remove('open');
    });

    function openModal(items) {
      modalList.innerHTML = items.map(function (s) {
        return `<div class="modal-stock-item" data-ticker="${s.ticker}" data-name="${esc(s.name)}">
          <div>
            <div class="modal-stock-name">${esc(s.name)}</div>
            <div class="modal-stock-meta">${s.ticker} · ${s.market}</div>
          </div>
        </div>`;
      }).join('');
      modalList.querySelectorAll('.modal-stock-item').forEach(function (el) {
        el.addEventListener('click', function () {
          applySelection(el.getAttribute('data-ticker'), el.getAttribute('data-name'));
          modal.classList.remove('open');
        });
      });
      modal.classList.add('open');
    }

    // ── 템플릿 (admin) ─────────────────────────────────────────────────────────
    let templateData = null;

    if (isAdmin) {
      document.getElementById('templatePanel').style.display = '';
      await loadTemplate();

      document.getElementById('tmplHeader').addEventListener('click', function () {
        const body = document.getElementById('tmplBody');
        const open = body.classList.toggle('open');
        document.getElementById('tmplToggleIcon').textContent = open ? '▼ 접기' : '▶ 펼치기';
      });

      document.getElementById('tmplSaveBtn').addEventListener('click', saveTemplate);
      document.getElementById('tmplResetBtn').addEventListener('click', async function () {
        if (!confirm('기본 템플릿으로 초기화하시겠습니까?')) return;
        try {
          await resetAnalysisTemplate();
          await loadTemplate();
          showToast('초기화되었습니다.');
        } catch (e) { showToast(e.message, 'error'); }
      });
    }

    async function loadTemplate() {
      try {
        templateData = await getAnalysisTemplate();
        renderTemplate(templateData);
      } catch (e) {
        showToast('템플릿 로드 실패: ' + e.message, 'error');
      }
    }

    function renderTemplate(tmpl) {
      document.getElementById('tmplSystemPrompt').value = tmpl.system_prompt || '';
      const sections = tmpl.sections || [];
      document.getElementById('tmplSections').innerHTML = sections.map(function (s, i) {
        return `<div class="section-card" data-idx="${i}">
          <div class="section-title-row">
            <span class="section-num">${i + 1}.</span>
            <input type="text" class="section-title-input" value="${esc(s.title)}" placeholder="섹션 제목">
          </div>
          <textarea class="tmpl-textarea" rows="3" placeholder="분석 프롬프트">${esc(s.prompt)}</textarea>
        </div>`;
      }).join('');
    }

    async function saveTemplate() {
      const systemPrompt = document.getElementById('tmplSystemPrompt').value.trim();
      const sections = [];
      document.querySelectorAll('#tmplSections .section-card').forEach(function (card, i) {
        sections.push({
          key:    (templateData && templateData.sections && templateData.sections[i])
                  ? templateData.sections[i].key : 'section_' + i,
          title:  card.querySelector('.section-title-input').value.trim(),
          prompt: card.querySelector('textarea').value.trim(),
        });
      });
      try {
        await updateAnalysisTemplate({ system_prompt: systemPrompt, sections });
        showToast('템플릿이 저장되었습니다.');
      } catch (e) { showToast(e.message, 'error'); }
    }

    // ── 분석 실행 ──────────────────────────────────────────────────────────────
    document.getElementById('analyzeBtn').addEventListener('click', doAnalysis);

    async function doAnalysis() {
      // 종목이 선택되지 않은 경우 — 입력값 자동 검색
      if (!selectedTicker) {
        const q = stockInput.value.trim();
        if (!q) { showToast('종목명 또는 종목코드를 입력해주세요.', 'error'); return; }
        try {
          const data = await searchStocks(q);
          const items = data.items || [];
          if (!items.length) { showToast('종목을 찾을 수 없습니다.', 'error'); return; }
          if (items.length === 1) {
            applySelection(items[0].ticker, items[0].name);
          } else {
            openModal(items);
            return; // 팝업에서 선택 후 다시 분석 버튼 누르도록
          }
        } catch (e) { showToast(e.message, 'error'); return; }
      }

      const priceVal = document.getElementById('priceInput').value.trim();
      const avgPrice = priceVal ? parseFloat(priceVal) : null;

      // UI 전환
      document.getElementById('resultWrap').classList.remove('visible');
      document.getElementById('loadingWrap').classList.add('visible');
      document.getElementById('analyzeBtn').disabled = true;

      // 로딩 스텝 애니메이션
      const steps = ['step1','step2','step3','step4'];
      let stepIdx = 0;
      function activateStep(i) {
        steps.forEach(function (id, j) {
          const el = document.getElementById(id);
          el.classList.remove('active','done');
          if (j < i)  el.classList.add('done');
          if (j === i) el.classList.add('active');
        });
      }
      activateStep(0);
      const stepTimer = setInterval(function () {
        stepIdx = Math.min(stepIdx + 1, steps.length - 1);
        activateStep(stepIdx);
      }, 2500);

      try {
        const result = await runAnalysis(selectedTicker, avgPrice);
        clearInterval(stepTimer);
        steps.forEach(function (id) {
          document.getElementById(id).classList.remove('active');
          document.getElementById(id).classList.add('done');
        });
        renderResult(result);
      } catch (e) {
        clearInterval(stepTimer);
        showToast(e.message, 'error');
      } finally {
        document.getElementById('loadingWrap').classList.remove('visible');
        document.getElementById('analyzeBtn').disabled = false;
      }
    }

    const SECTION_ICONS = {
      core_business: '🏢',
      technical:     '📊',
      price_rise:    '📈',
      investor_view: '💡',
    };

    function renderResult(result) {
      // 리서치 뱃지
      const badge = document.getElementById('researchBadge');
      if (result.research_count > 0) {
        document.getElementById('researchCount').textContent = result.research_count;
        badge.style.display = '';
      } else {
        badge.style.display = 'none';
      }

      // 요약 (매수/매도/전망)
      document.getElementById('summaryContent').textContent = result.summary || '';

      // 지표 박스
      document.getElementById('stockInfoBox').textContent = result.stock_info || '';

      // 섹션별
      const sections = result.sections || [];
      document.getElementById('resultSections').innerHTML = sections.map(function (s) {
        const icon = SECTION_ICONS[s.key] || '📋';
        return `<div class="result-section">
          <h3>${icon} ${esc(s.title)}</h3>
          <div class="result-content">${esc(s.content)}</div>
        </div>`;
      }).join('');

      document.getElementById('resultWrap').classList.add('visible');
      document.getElementById('resultWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function showToast(msg, type) {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;
        padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;
        background:${type === 'error' ? '#fee2e2' : '#dcfce7'};
        color:${type === 'error' ? '#991b1b' : '#166534'};
        box-shadow:0 4px 16px rgba(0,0,0,.12);`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 3500);
    }
  })();
  </script>
</body>
</html>
