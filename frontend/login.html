<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 댕댕투자</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>🐶 <span>댕댕투자</span></h1>
        <p>한국 주식 조건검색 시스템</p>
      </div>

      <div class="alert alert-error" id="errMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">아이디</label>
          <input class="form-control" type="text" id="username" placeholder="아이디 입력" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input class="form-control" type="password" id="password" placeholder="비밀번호 입력" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="loginBtn">로그인</button>
      </form>

      <div class="auth-footer">
        계정이 없으신가요? <a href="/signup.html">회원가입</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // 이미 로그인된 경우 메인으로
    if (getToken()) location.href = '/main.html';

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errMsg');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '로그인 중...';

      try {
        await login(
          document.getElementById('username').value,
          document.getElementById('password').value,
        );
        location.href = '/main.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
