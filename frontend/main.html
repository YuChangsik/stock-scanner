<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>댕댕투자</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    .scan-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .scan-date-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      padding: 9px 13px;
      outline: none;
      transition: border-color .15s;
    }
    .scan-date-input:focus { border-color: var(--accent); }
    .name-link {
      cursor: pointer;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color .15s, text-decoration .15s;
    }
    .name-link:hover {
      text-decoration: underline;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="/main.html">🐶 <span>댕댕투자</span></a>
    <button class="navbar-toggle" id="navToggle" aria-label="메뉴">☰</button>
    <div class="navbar-nav" id="navMenu">
      <span class="nav-user" id="navUser"></span>
      <a class="nav-link active" href="/main.html"    data-page="home">홈</a>
      <a class="nav-link" href="/settings.html"       data-page="settings">⚙️ 조건설정</a>
      <a class="nav-link" href="/sector.html"         data-page="sector">🏭 업종현황</a>
      <a class="nav-link" href="/research.html"       data-page="research">📰 리서치</a>
      <a class="nav-link" href="/analysis.html"       data-page="analysis">🤖 종목분석</a>
      <a class="nav-link" href="/notify.html"         data-page="notify">🔔 알림설정</a>
      <a class="nav-link" href="/admin.html"          data-page="admin" data-role="admin">🛠 배치관리</a>
      <a class="nav-link" href="/permissions.html"    data-page="permissions" data-role="admin">🔐 권한관리</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn">로그아웃</button>
    </div>
  </nav>

  <div class="container">
    <!-- Header -->
    <div class="page-header">
      <div>
        <div class="page-title" id="pageTitle">조건검색</div>
        <div class="page-subtitle" id="scanDate">최근 데이터 기준</div>
      </div>
      <div class="scan-controls">
        <input type="date" class="scan-date-input" id="scanDateInput" title="조회 기준일 (기본: 전 거래일)" />
        <button class="btn btn-primary" id="scanBtn">🔍 검색 실행</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">매칭 종목 수</div>
        <div class="stat-value green" id="statMatched">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">활성 조건 수</div>
        <div class="stat-value blue" id="statConditions">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">검색 대상</div>
        <div class="stat-value" id="statTotal">전종목</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">마지막 검색</div>
        <div class="stat-value yellow" id="statTime" style="font-size:14px">-</div>
      </div>
    </div>

    <!-- Active Conditions Tags -->
    <div id="conditionsTags" style="margin-bottom:16px; display:flex; gap:8px; flex-wrap:wrap;"></div>

    <!-- Result Table -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">검색 결과</span>
        <span style="color:var(--text2);font-size:12px" id="resultInfo"></span>
      </div>
      <!-- 만족 조건 표시 (표 상단) -->
      <div id="matchedCondRow" style="display:none;padding:8px 16px 10px;border-bottom:1px solid var(--border);align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--text2);white-space:nowrap">만족 조건</span>
        <div id="matchedCondTags" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="table-wrap">
        <div class="loading" id="loadingEl">
          <div class="spinner"></div>
          데이터를 불러오는 중...
        </div>
        <table id="resultTable" style="display:none">
          <thead>
            <tr>
              <th>순위</th>
              <th>종목코드</th>
              <th>종목명 <span style="font-size:10px;color:var(--accent);font-weight:400;opacity:0.7">🤖 AI분석</span></th>
              <th class="num">종가</th>
              <th class="num">등락률</th>
              <th class="num">거래량</th>
              <th>업종</th>
              <th class="num">MA5</th>
              <th class="num">MA20</th>
              <th class="num">RSI14</th>
              <th class="num">PER / 업종평균</th>
              <th class="num">PBR</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
        <div id="emptyEl" style="display:none" class="loading">
          <div style="font-size:32px;margin-bottom:8px">🔍</div>
          조건을 만족하는 종목이 없습니다.<br>
          <a href="/settings.html" style="color:var(--blue)">조건을 완화해보세요</a>
        </div>
      </div>
    </div>
  </div>

  <!-- 종목 상세 모달 -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle">-</div>
          <div class="modal-subtitle" id="modalSubtitle">-</div>
        </div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="chart">차트</button>
        <button class="modal-tab" data-tab="investor">투자자</button>
        <button class="modal-tab" data-tab="annual">연간실적</button>
        <button class="modal-tab" data-tab="quarter">분기실적</button>
        <button class="modal-tab" data-tab="research">리서치</button>
      </div>
      <div class="modal-body">
        <div class="modal-panel active" id="panel-chart">
          <div class="loading"><div class="spinner"></div>불러오는 중...</div>
        </div>
        <div class="modal-panel" id="panel-investor">
          <div class="loading"><div class="spinner"></div>불러오는 중...</div>
        </div>
        <div class="modal-panel" id="panel-annual">
          <div class="loading"><div class="spinner"></div>불러오는 중...</div>
        </div>
        <div class="modal-panel" id="panel-quarter">
          <div class="loading"><div class="spinner"></div>불러오는 중...</div>
        </div>
        <div class="modal-panel" id="panel-research">
          <div class="loading"><div class="spinner"></div>불러오는 중...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    initNav();
    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearAuth(); location.href = '/login.html';
    });

    function conditionLabel(c) {
      const params = c.params || {};
      if (c.name === 'volume_rank')        return `거래량 순위 Top ${params.threshold ?? 20}`;
      if (c.name === 'rsi14')              return `RSI 14 ${params.operator ?? '<'} ${params.threshold ?? 40}`;
      if (c.name === 'golden_cross')       return `골든크로스 (MA5↑MA20)${params.within_days ? ' ' + params.within_days + '일 이내' : ''}`;
      if (c.name === 'macd')               return 'MACD 골든크로스';
      if (c.name === 'macd_histogram')     return 'MACD 히스토그램';
      if (c.name === 'ma_above')           return `기준선 위 (${params.period ?? 60}일선)`;
      if (c.name === 'ma_alignment')       return '이동평균 배열 상태';
      if (c.name === 'prev_high_breakout') return '전고점 돌파';
      if (c.name === 'per')                return `PER (주가수익비율) ${params.operator ?? '<'} ${params.threshold ?? 15}`;
      if (c.name === 'pbr')                return `PBR (주가순자산비율) ${params.operator ?? '<'} ${params.threshold ?? 1}`;
      if (c.name === 'sector') {
        const list = params.sectors || [];
        return list.length ? `업종 필터: ${list.join('/')}` : '업종 필터 (전체)';
      }
      if (c.name === 'volume_surge')       return `거래량 급증 (${params.multiplier ?? 2}배↑)`;
      if (c.name === 'volume_recovery')    return '거래량 감소 후 재증가';
      if (c.name === 'obv_rising')         return 'OBV 상승 (매집 신호)';
      if (c.name === 'bollinger_band')     return '볼린저밴드 위치';
      if (c.name === 'atr')                return 'ATR 변동성 조건';
      return c.name;
    }

    function rankBadge(i) {
      const cls = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-n';
      return `<span class="rank-badge ${cls}">${i + 1}</span>`;
    }

    // 업종 평균 PER 캐시 { 업종명: avg_per }
    let sectorAvgPerMap = {};

    async function loadSectorAvgPer() {
      try {
        const data = await getSectorStats();
        sectorAvgPerMap = {};
        (data.stats || []).forEach(s => {
          if (s.avg_per != null) sectorAvgPerMap[s.sector] = s.avg_per;
        });
      } catch (_) { /* 실패해도 표 렌더링에 영향 없음 */ }
    }

    function renderTags(conditions) {
      const wrap = document.getElementById('conditionsTags');
      wrap.innerHTML = (conditions || []).map(c =>
        `<span class="badge badge-blue">${conditionLabel(c)}</span>`
      ).join('');
      document.getElementById('statConditions').textContent = (conditions || []).length;
    }

    function renderMatchedCondRow(matches) {
      const row = document.getElementById('matchedCondRow');
      const tags = document.getElementById('matchedCondTags');
      // 첫 번째 매치의 matched_conditions 사용 (AND 스캔이므로 모든 행 동일)
      const conds = (matches[0]?.matched_conditions || []);
      if (!conds.length) { row.style.display = 'none'; return; }
      tags.innerHTML = conds.map(c =>
        `<span class="badge badge-green" style="font-size:11px">${conditionLabel({name:c,params:{}}) || c}</span>`
      ).join('');
      row.style.display = 'flex';
    }

    function fmtPer(per, sector) {
      if (per == null) return '-';
      const perStr = per.toFixed(2);
      const avg = sector ? sectorAvgPerMap[sector] : null;
      if (avg == null) return perStr;
      const diffCls = per < avg ? 'chg-up' : 'chg-dn';  // 업종평균보다 낮으면 저평가(green)
      return `${perStr} <span class="${diffCls}" style="font-size:10px">(업종 ${avg.toFixed(1)})</span>`;
    }

    function renderTable(matches) {
      const loading = document.getElementById('loadingEl');
      const table   = document.getElementById('resultTable');
      const empty   = document.getElementById('emptyEl');
      const body    = document.getElementById('resultBody');

      loading.style.display = 'none';

      const limit = getDisplayCount();
      const topN = matches.slice(0, limit);
      document.getElementById('statMatched').textContent = matches.length;
      document.getElementById('resultInfo').textContent  =
        matches.length > limit
          ? `총 ${matches.length}개 중 상위 ${topN.length}개 표시`
          : `총 ${matches.length}개`;

      if (topN.length === 0) {
        empty.style.display = 'block';
        table.style.display = 'none';
        document.getElementById('matchedCondRow').style.display = 'none';
        return;
      }

      renderMatchedCondRow(topN);

      body.innerHTML = topN.map((m, i) => {
        const ind = m.indicators || {};
        return `<tr>
          <td>${rankBadge(i)}</td>
          <td class="ticker-cell"><span class="ticker-link" onclick="openDetail('${m.ticker}','${m.name||m.ticker}')">${m.ticker}</span></td>
          <td class="name-cell"><span class="name-link" onclick="goAnalysis('${m.ticker}','${m.name||m.ticker}')" title="AI 종목분석">🤖 ${m.name || '-'}</span></td>
          <td class="num">${fmt(ind.close)}</td>
          <td class="num">${fmtChgPct(ind.change_pct)}</td>
          <td class="num">${fmt(ind.volume)}</td>
          <td class="sector-cell">${m.sector || '-'}</td>
          <td class="num">${fmt(ind.ma5, 0)}</td>
          <td class="num">${fmt(ind.ma20, 0)}</td>
          <td class="num">${fmtRsi(ind.rsi14)}</td>
          <td class="num">${fmtPer(ind.per, m.sector)}</td>
          <td class="num">${ind.pbr != null ? ind.pbr.toFixed(2) : '-'}</td>
        </tr>`;
      }).join('');

      table.style.display = 'table';
    }

    async function loadLatest() {
      try {
        const data = await getLatestResults();
        const job  = data.job;
        document.getElementById('scanDate').textContent =
          `기준일: ${job.trade_date} · 상태: ${job.status}`;
        document.getElementById('statTime').textContent =
          job.finished_at ? new Date(job.finished_at).toLocaleString('ko-KR') : '-';
        renderTable(data.matches || []);
      } catch {
        document.getElementById('loadingEl').innerHTML =
          '<div style="color:var(--text2)">저장된 검색 결과가 없습니다.<br>먼저 검색을 실행하세요.</div>';
      }
    }

    async function doScan() {
      const btn = document.getElementById('scanBtn');
      btn.disabled = true;
      btn.textContent = '검색 중...';
      document.getElementById('loadingEl').style.display = 'block';
      document.getElementById('resultTable').style.display = 'none';
      document.getElementById('emptyEl').style.display    = 'none';

      try {
        const me = await getMe();
        const conditions = me.scan_conditions || [];
        if (conditions.length === 0) {
          alert('조건이 설정되지 않았습니다. 조건설정 페이지에서 먼저 조건을 추가하세요.');
          return;
        }
        renderTags(conditions);

        // 날짜 입력값 사용 (없으면 서버가 자동으로 최신 날짜 사용)
        const selectedDate = document.getElementById('scanDateInput').value || undefined;
        const result       = await runScan(conditions, selectedDate);

        const tradeDate = result.job?.trade_date || selectedDate || '-';
        document.getElementById('scanDate').textContent = `기준일: ${tradeDate} · 검색 완료`;
        document.getElementById('statTime').textContent  = new Date().toLocaleString('ko-KR');
        renderTable(result.matches || []);
      } catch (ex) {
        alert('검색 실패: ' + ex.message);
        document.getElementById('loadingEl').innerHTML =
          '<div style="color:var(--red)">' + ex.message + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = '🔍 검색 실행';
      }
    }

    document.getElementById('scanBtn').addEventListener('click', doScan);

    // ── 종목 상세 모달 ────────────────────────────────────────────
    const modal = document.getElementById('detailModal');
    function closeModal() {
      modal.classList.remove('open');
      if (_chartInstance) { try { _chartInstance.remove(); } catch(_){} _chartInstance = null; }
    }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    document.querySelectorAll('.modal-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.modal-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.modal-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        // 차트 탭 재진입 시 너비 맞춤
        if (btn.dataset.tab === 'chart' && _chartInstance) {
          const c = document.getElementById('chartContainer');
          if (c) _chartInstance.applyOptions({ width: c.clientWidth });
        }
      });
    });

    function fmtFin(v) {
      if (v == null || v === '') return '-';
      const n = parseFloat(v);
      if (isNaN(n)) return v;
      const cls = n > 0 ? 'fin-pos' : n < 0 ? 'fin-neg' : '';
      return cls ? `<span class="${cls}">${n.toLocaleString('ko-KR')}</span>` : n.toLocaleString('ko-KR');
    }

    function buildFinTable(data) {
      const fi = data?.financeInfo;
      if (!fi || !fi.rowList?.length)
        return '<div style="color:var(--text2);padding:20px 0">데이터 없음</div>';

      const titles = fi.trTitleList || [];
      const rows   = fi.rowList     || [];

      let html = '<div style="overflow-x:auto"><table class="fin-table"><thead><tr><th>항목</th>';
      titles.forEach(t => {
        const mark = t.isConsensus === 'Y' ? '<span style="color:var(--yellow);font-size:10px"> 추정</span>' : '';
        html += `<th>${t.title}${mark}</th>`;
      });
      html += '</tr></thead><tbody>';
      rows.forEach(row => {
        html += `<tr><td>${row.title}</td>`;
        titles.forEach(t => {
          const cell = row.columns?.[t.key];
          html += `<td>${fmtFin(cell?.value ?? '-')}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      return html;
    }

    function buildResearch(list) {
      if (!Array.isArray(list) || !list.length)
        return '<div style="color:var(--text2);padding:20px 0">리서치 데이터 없음</div>';
      return list.map(r => `
        <div class="research-item">
          <div class="research-title"><a href="${r.endUrl || '#'}" target="_blank" rel="noopener">${r.title || '제목 없음'}</a></div>
          <div class="research-meta">
            <span>${r.brokerName || '-'}</span>
            <span>${r.writeDate  || '-'}</span>
            <span>조회 ${Number(r.readCount || 0).toLocaleString('ko-KR')}</span>
          </div>
        </div>`).join('');
    }

    function buildInvestor(rows) {
      // rows = dealTrendInfos from Naver integration API
      // Fields: bizdate, individualPureBuyQuant, foreignerPureBuyQuant, organPureBuyQuant,
      //         closePrice, compareToPreviousClosePrice, accumulatedTradingVolume, foreignerHoldRatio
      if (!Array.isArray(rows) || !rows.length)
        return '<div style="color:var(--text2);padding:20px 0">투자자 데이터 없음</div>';

      // Parse Naver number strings like "+8,324,987" or "-9,595,937"
      const parseQuant = v => {
        if (v == null) return null;
        return parseInt(String(v).replace(/,/g, ''), 10);
      };

      const fmtQuant = v => {
        if (v == null) return '-';
        const cls  = v > 0 ? 'chg-up' : v < 0 ? 'chg-dn' : '';
        const sign = v > 0 ? '+' : '';
        const txt  = Math.abs(v).toLocaleString('ko-KR');
        return cls ? `<span class="${cls}">${sign}${txt}</span>` : txt;
      };

      const fmtPrice = v => {
        if (!v) return '-';
        const n = parseInt(String(v).replace(/,/g, ''), 10);
        return isNaN(n) ? v : n.toLocaleString('ko-KR');
      };

      const fmtDiff = (v, dir) => {
        if (!v) return '-';
        const n = parseInt(String(v).replace(/,/g, ''), 10);
        if (isNaN(n) || n === 0) return '-';
        const isUp = dir?.name === 'RISING';
        const isDn = dir?.name === 'FALLING';
        const cls  = isUp ? 'chg-up' : isDn ? 'chg-dn' : '';
        const sign = isUp ? '+' : isDn ? '-' : '';
        return cls ? `<span class="${cls}">${sign}${Math.abs(n).toLocaleString('ko-KR')}</span>` : String(n);
      };

      let html = `<div style="overflow-x:auto"><table class="fin-table">
        <thead><tr>
          <th>날짜</th>
          <th class="num">종가</th>
          <th class="num">전일대비</th>
          <th class="num">개인 순매수</th>
          <th class="num">외국인 순매수</th>
          <th class="num">기관 순매수</th>
          <th class="num">외인소진율</th>
        </tr></thead><tbody>`;

      for (const r of rows) {
        const d = String(r.bizdate || '');
        const dateStr = d.length === 8
          ? `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}` : d;
        html += `<tr>
          <td>${dateStr}</td>
          <td class="num">${fmtPrice(r.closePrice)}</td>
          <td class="num">${fmtDiff(r.compareToPreviousClosePrice, r.compareToPreviousPrice)}</td>
          <td class="num">${fmtQuant(parseQuant(r.individualPureBuyQuant))}</td>
          <td class="num">${fmtQuant(parseQuant(r.foreignerPureBuyQuant))}</td>
          <td class="num">${fmtQuant(parseQuant(r.organPureBuyQuant))}</td>
          <td class="num" style="color:var(--text2)">${r.foreignerHoldRatio || '-'}</td>
        </tr>`;
      }
      html += '</tbody></table></div>';

      // 범례
      html += `<div style="margin-top:8px;font-size:11px;color:var(--text-muted)">
        ※ 순매수 = 매수수량 − 매도수량 &nbsp;|&nbsp;
        <span class="chg-up">▲ 양수 = 순매수</span>&nbsp;
        <span class="chg-dn">▼ 음수 = 순매도</span>
      </div>`;
      return html;
    }

    let _chartInstance = null;  // lightweight-charts 인스턴스 보관

    function buildChart(prices, containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;

      // 기존 차트 제거
      if (_chartInstance) { try { _chartInstance.remove(); } catch(_){} _chartInstance = null; }
      container.innerHTML = '';

      if (!prices || !prices.length) {
        container.innerHTML = '<div style="color:var(--text2);padding:20px 0">가격 데이터 없음</div>';
        return;
      }

      const chart = LightweightCharts.createChart(container, {
        width:  container.clientWidth || 560,
        height: 300,
        layout: { background: { color: '#0d1117' }, textColor: '#c9d1d9' },
        grid:   { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#21262d' },
        timeScale: { borderColor: '#21262d', timeVisible: true },
      });
      _chartInstance = chart;

      // 캔들스틱
      const candle = chart.addCandlestickSeries({
        upColor: '#ff7b72', downColor: '#79c0ff',
        borderUpColor: '#ff7b72', borderDownColor: '#79c0ff',
        wickUpColor: '#ff7b72', wickDownColor: '#79c0ff',
      });
      candle.setData(prices.map(p => ({
        time: p.date, open: p.open, high: p.high, low: p.low, close: p.close,
      })));

      // 거래량 (두 번째 pane)
      const volSeries = chart.addHistogramSeries({
        color: '#30363d',
        priceFormat: { type: 'volume' },
        priceScaleId: 'vol',
        scaleMargins: { top: 0.8, bottom: 0 },
      });
      volSeries.setData(prices.map(p => ({
        time: p.date,
        value: p.volume,
        color: p.close >= p.open ? 'rgba(255,123,114,0.4)' : 'rgba(121,192,255,0.4)',
      })));

      chart.timeScale().fitContent();

      // 리사이즈 대응
      const ro = new ResizeObserver(() => {
        chart.applyOptions({ width: container.clientWidth });
      });
      ro.observe(container);
    }

    function goAnalysis(ticker, name) {
      location.href = `/analysis.html?ticker=${encodeURIComponent(ticker)}&name=${encodeURIComponent(name)}`;
    }

    async function openDetail(ticker, name) {
      document.getElementById('modalTitle').textContent    = `${name} (${ticker})`;
      document.getElementById('modalSubtitle').textContent = '불러오는 중...';
      ['chart','investor','annual','quarter','research'].forEach(t => {
        document.getElementById('panel-' + t).innerHTML =
          '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';
      });
      document.querySelectorAll('.modal-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.modal-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('.modal-tab[data-tab="chart"]').classList.add('active');
      document.getElementById('panel-chart').classList.add('active');
      modal.classList.add('open');

      // 차트 데이터와 상세 정보 병렬 로드
      const [prices, detail] = await Promise.allSettled([
        getTickerPrices(ticker, 90),
        getStockDetail(ticker),
      ]);

      // 차트
      const priceData = prices.status === 'fulfilled' ? prices.value : [];
      document.getElementById('panel-chart').innerHTML =
        `<div id="chartContainer" style="width:100%;border-radius:6px;overflow:hidden"></div>`;
      buildChart(priceData, 'chartContainer');

      // 상세
      if (detail.status === 'fulfilled') {
        const d = detail.value;
        document.getElementById('modalSubtitle').textContent = d.market || '';
        document.getElementById('panel-annual').innerHTML   = buildFinTable(d.annual);
        document.getElementById('panel-quarter').innerHTML  = buildFinTable(d.quarter);
        document.getElementById('panel-investor').innerHTML = buildInvestor(d.investor);
        document.getElementById('panel-research').innerHTML = buildResearch(d.research);
      } else {
        ['annual','quarter','investor','research'].forEach(t => {
          document.getElementById('panel-' + t).innerHTML =
            `<div style="color:var(--red);padding:20px 0">불러오지 못했습니다: ${detail.reason?.message}</div>`;
        });
      }
    }

    // 페이지 타이틀에 표시 수 반영
    document.getElementById('pageTitle').textContent = `조건검색 Top ${getDisplayCount()}`;

    // 초기 로드: 날짜 기본값 = 서버 최근 거래일
    (async () => {
      // 업종 평균 PER 캐시 + 거래일 + 사용자 설정 병렬 로드
      const [, , me] = await Promise.all([
        loadSectorAvgPer(),
        getLatestTradingDay().then(d => {
          document.getElementById('scanDateInput').value = d.trade_date;
        }).catch(() => {}),
        getMe(),
      ]);
      renderTags(me.scan_conditions);
      if (me.scan_conditions && me.scan_conditions.length > 0) {
        await doScan();
      } else {
        await loadLatest();
      }
    })();
  </script>
